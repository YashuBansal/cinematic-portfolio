<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Using Oswald for bold display headings and Inter for body text -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Jashan Khunger | Cinematic Video Editor</title>
  </head>
  <body>
    <style>
      body { margin: 0; background-color: #050505; }
      #global-loader {
        position: fixed; inset: 0; z-index: 99999;
        background-color: #050505; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-family: 'Oswald', sans-serif;
        transition: opacity 0.8s ease-out, visibility 0.8s;
      }
      .gl-logo { font-size: 2.5rem; font-weight: 700; letter-spacing: 0.1em; color: white; text-transform: uppercase; animation: glFade 0.5s ease-out; }
      .gl-logo span { color: #00E5FF; }
      .gl-bar-wrap { width: 16rem; height: 4px; background: rgba(255,255,255,0.1); border-radius: 999px; margin-top: 2rem; position: relative; overflow: hidden; }
      .gl-bar { position: absolute; left: 0; top: 0; height: 100%; background: #00E5FF; box-shadow: 0 0 15px rgba(0,229,255,0.5); width: 0%; animation: glProgress 3s ease-out forwards; }
      @keyframes glFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes glProgress { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
    <div id="global-loader">
      <div class="gl-logo">JASHAN<span>.</span></div>
      <div class="gl-bar-wrap"><div class="gl-bar"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
